name: meshly
description: "Mesh.ly — offline-ready mesh messaging (frontend prototype)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  nearby_connections: ^4.3.0
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true